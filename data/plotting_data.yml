prices:
  name: Prices
  title: Prices
  projection: 2d
  axis_visible: true
  grid_visible: true
  ticks_visible: true
  frame_visible: true
  plots:
    prices:
      checkbox_name: Prices
      toggled: true
      linestyle: solid
      linewidth: 1.5
      markersize: 6.0
      label_template: Price of {i}
      colors: [red, blue, green, purple, orange]
      traj_key: prices
    values:
      checkbox_name: Values
      toggled: true
      linestyle: dashed
      linewidth: 1.5
      markersize: 6.0
      label_template: Value of {i}
      colors: [red, blue, green, purple, orange]
      traj_key: values
  default_lims: [[0.0, 3000.0], [0.0, 0.311507]]
