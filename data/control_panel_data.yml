divider1:
  title: Parameters
row1:
  exe_path:
    param_name: exe_path
    control_type: file_picker
    label: 'Binary path: '
    mode: file
    tooltip: Location of binary.
row2:
  N_S:
    param_name: N_S
    tooltip: Number of time steps to simulate
    control_type: entry_block
    label: $N_S=$
    type: scalar
    scalar_type: int
    range: [0, 10000]
  T:
    param_name: T
    tooltip: Starting number of hours in the working day
    control_type: entry_block
    type: scalar
    scalar_type: int
    range: [1, 24]
    label: T=
  W:
    param_name: W
    tooltip: Starting number of days in the working week
    control_type: entry_block
    type: scalar
    scalar_type: int
    range: [1, 7]
    label: $W=$
row3:
  N_g:
    param_name: N_g
    tooltip: Number of goods
    control_type: entry_block
    type: scalar
    scalar_type: int
    range: [1, 100]
    label: $N_C=$
  N_h:
    param_name: N_h
    tooltip: Initital number of people
    control_type: entry_block
    type: scalar
    scalar_type: int
    range: [10, 1000]
    label: $N_h=$
  N_a:
    param_name: N_a
    control_type: entry_block
    type: scalar
    scalar_type: int
    range: [1, 100]
    label: $N_a=$
    tooltip: Number of abilities
row4:
  N_m:
    param_name: N_m
    tooltip: Number of machines
    control_type: entry_block
    type: scalar
    scalar_type: int
    range: [1, 10]
    label: $N_m=$
  N_p:
    param_name: N_p
    tooltip: Starting number of producers
    control_type: entry_block
    type: scalar
    scalar_type: int
    range: [1, 100]
    label: $N_p=$
  N_d:
    param_name: N_d
    tooltip: Starting number of distributors
    control_type: entry_block
    type: scalar
    scalar_type: int
    range: [1, 100]
    label: $N_d=$
row5:
  S:
    param_name: S
    control_type: entry_block
    type: scalar
    scalar_type: float
    range: [0.0, 1.0]
    label: $S=$
    tooltip: Daily chance of getting sick
  v_ability:
    param_name: v_ability
    control_type: entry_block
    type: scalar
    scalar_type: float
    range: [0.0, 1.0]
    label: $\sigma_a=$
    tooltip: Person ability standard deviation
  N_inputs_max:
    param_name: N_inputs_max
    control_type: entry_block
    type: scalar
    scalar_type: int
    range: [1, 10]
    label: $N_i=$
    tooltip: Max number of inputs per good
row6:
  productivity:
    param_name: productivity
    control_type: entry_block
    type: scalar
    scalar_type: float
    range: [0.0, 1.0]
    label: $\epsilon_A=$
    tooltip: Product input epsilon. Degree of productivity in society.
  consump_epsilon:
    param_name: consump_epsilon
    control_type: entry_block
    type: scalar
    scalar_type: float
    range: [0.0, 1.0]
    label: $\epsilon_c=$
    tooltip: ''
row7:
  init_prices:
    control_type: dropdown
    label: Initial Prices
    tooltip: ''
    param_name: init_prices
    names: [Labor Values, Equilibrium Prices]
    values: [labor_values, equilibrium_prices]
    use_names_func: false
row8:
  fixed_seed:
    control_type: checkbox
    label: Fixed Seed
    tooltip: ''
    param_name: fixed_seed
    change_effect: send_message
  seed:
    param_name: seed
    control_type: entry_block
    type: scalar
    scalar_type: int
    range: [0, 10000]
    label: 'Seed = '
    tooltip: ''
  free_goods:
    control_type: checkbox
    label: Free Goods
    tooltip: If checked, a random good will be made free every $\Delta_F$ many time
      steps.
    param_name: free_goods
    change_effect: send_message
  new_free_good_interval:
    param_name: new_free_good_interval
    control_type: entry_block
    type: scalar
    scalar_type: int
    range: [1, 10000]
    label: $\Delta_F=$
    tooltip: After this many time steps, a new random good is made free through public
      sector taxation.
